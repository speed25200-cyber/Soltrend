name: Deploy web to GitHub Pages

on:
  push:
    branches: [claude/solana-casino-complete-23elkr, main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; newer pushes cancel in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      # Auto-enables Pages (build type: workflow) so no manual Source step is needed.
      # Requires the repo to be public (free plan) or GitHub Pro for a private repo.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Build static export
        run: npm run build
        env:
          STATIC_EXPORT: 'true'
          # Must match the repo name for project Pages (case-sensitive).
          BASE_PATH: '/Soltrend'
          NEXT_PUBLIC_SOLANA_RPC: 'https://api.devnet.solana.com'
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
